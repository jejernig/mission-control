version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: mission-control-queue
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: mission-control
      RABBITMQ_DEFAULT_PASS: mFAxUw6adjNVUn1w/zPATzte1f2aGempx3CIXDmROlk=
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  rabbitmq-data:
    driver: local
